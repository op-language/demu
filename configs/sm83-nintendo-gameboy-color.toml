# Nintendo Game Boy Color (CGB), the canonical system configuration.
#
# One clock domain at the 4194304 Hz crystal. The CGB double-speed mode
# halves the domain dots per CPU T-cycle; the switch runs on STOP over
# the declared speed connection. The machine boots through the 2304-byte
# boot ROM, used under the SameBoy MIT license; the $FF50 writes unmap
# it at the end of boot.

[system]
name = "Nintendo Game Boy Color"
triple = "sm83-nintendo-gameboy-color"
description = "The dual-speed Game Boy Color with the CGB boot ROM."

[clock.main]
frequency = "4194304"
origin = "CGB crystal; dots stay fixed across the speed switch"

[[device]]
name = "cpu0"
kind = "sm83.cpu"
domain = "main"
[device.dividers]
cpu = 1

[[device]]
name = "bootrom"
kind = "sm83.bootrom"
domain = "main"
[device.params]
cgb = true

[[device]]
name = "cart"
kind = "sm83.cart"
domain = "main"

[[device]]
name = "wram"
kind = "sm83.wram"
domain = "main"
[device.params]
cgb = true

[[device]]
name = "hram"
kind = "sm83.hram"
domain = "main"

[[device]]
name = "ppu"
kind = "sm83.ppu"
domain = "main"
[device.params]
cgb = true

[[device]]
name = "apu"
kind = "sm83.apu"
domain = "main"
[device.params]
cgb = true

[[device]]
name = "dma"
kind = "sm83.dma"
domain = "main"

[[device]]
name = "hdma"
kind = "sm83.hdma"
domain = "main"

[[device]]
name = "timer"
kind = "sm83.timer"
domain = "main"

[[device]]
name = "joypad"
kind = "sm83.joypad"
domain = "main"

[[device]]
name = "serial"
kind = "sm83.serial"
domain = "main"

[[device]]
name = "io"
kind = "sm83.io"
domain = "main"
[device.params]
cgb = true

[[bus]]
name = "cpu"
address_bits = 16
owner = "cpu0"

[[window]]
name = "w_bootrom"
bus = "cpu"
device = "bootrom"
base = "0x0000"
size = "0x0100"
overlay = "boot"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_bootrom_upper"
bus = "cpu"
device = "bootrom"
base = "0x0200"
size = "0x0800"
overlay = "boot_upper"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_cart_rom0"
bus = "cpu"
device = "cart"
base = "0x0000"
size = "0x4000"
overlay = "boot"

[[window]]
name = "w_cart_romn"
bus = "cpu"
device = "cart"
base = "0x4000"
size = "0x4000"
overlay = "boot"

[[window]]
name = "w_ppu_vram"
bus = "cpu"
device = "ppu"
base = "0x8000"
size = "0x2000"

[[window]]
name = "w_cart_sram"
bus = "cpu"
device = "cart"
base = "0xA000"
size = "0x2000"

[[window]]
name = "w_wram"
bus = "cpu"
device = "wram"
base = "0xC000"
size = "0x2000"

[[window]]
name = "w_wram_echo"
bus = "cpu"
device = "wram"
base = "0xE000"
size = "0x1E00"

[[window]]
name = "w_io"
bus = "cpu"
device = "io"
base = "0xFF00"
size = "0x80"

[[window]]
name = "w_joypad"
bus = "cpu"
device = "joypad"
base = "0xFF00"
size = "0x01"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_serial"
bus = "cpu"
device = "serial"
base = "0xFF01"
size = "0x02"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_timer"
bus = "cpu"
device = "timer"
base = "0xFF04"
size = "0x04"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_apu"
bus = "cpu"
device = "apu"
base = "0xFF10"
size = "0x20"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_ppu_regs"
bus = "cpu"
device = "ppu"
base = "0xFF40"
size = "0x0C"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_dma"
bus = "cpu"
device = "dma"
base = "0xFF46"
size = "0x01"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_speed"
bus = "cpu"
device = "io"
base = "0xFF4D"
size = "0x01"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_hdma"
bus = "cpu"
device = "hdma"
base = "0xFF51"
size = "0x05"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_ppu_pal"
bus = "cpu"
device = "ppu"
base = "0xFF68"
size = "0x05"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_swbk"
bus = "cpu"
device = "wram"
base = "0xFF70"
size = "0x01"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[window]]
name = "w_hram"
bus = "cpu"
device = "hram"
base = "0xFF80"
size = "0x7F"

[[window]]
name = "w_bootrom_bank"
bus = "cpu"
device = "bootrom"
base = "0xFF50"
size = "0x01"
overlay = "regs"
overlay_read_priority = 1
overlay_write_priority = 1

[[connection]]
from = "ppu.vblank"
to = "cpu0.vblank"
semantics = "irq"

[[connection]]
from = "ppu.stat"
to = "cpu0.stat"
semantics = "irq"

[[connection]]
from = "timer.int"
to = "cpu0.timer"
semantics = "irq"

[[connection]]
from = "joypad.int"
to = "cpu0.joypad"
semantics = "irq"

[[connection]]
from = "serial.int"
to = "cpu0.serial"
semantics = "irq"

[[connection]]
from = "timer.div_apu"
to = "apu.div_apu"
semantics = "display-sync"

[[connection]]
from = "ppu.hblank"
to = "hdma.hblank"
semantics = "display-sync"

[[connection]]
from = "cpu0.speed"
to = "io.speed"
semantics = "irq"

[[connection]]
from = "cpu0.speed"
to = "timer.speed"
semantics = "irq"

[[connection]]
from = "cpu0.speed"
to = "dma.speed"
semantics = "irq"

[[connection]]
from = "io.key0"
to = "ppu.key0"
semantics = "irq"

