# Atari 800, PAL: the 6502 at one quarter of the PAL master crystal.
#
# One clock domain at the PAL color clock, 7093790/2 Hz = 3546895 Hz.
# One CPU cycle is two ticks (1773447.5 Hz); ANTIC and GTIA walk one
# color clock per visit, so a line is 228 ticks. ANTIC declares the
# PAL region and walks 312-line frames; the POKEY serial rates differ
# by region and stay out of scope.

[system]
name = "Atari 800 (PAL)"
triple = "mos6502-atari-800-pal"
description = "The PAL Atari 800 home computer with ANTIC, GTIA, POKEY, and PIA."

[clock.main]
frequency = "7093790/2"
origin = "PAL color clock; the CPU cycle is two ticks, as on the NTSC form"

[[device]]
name = "cpu0"
kind = "mos6502.cpu"
domain = "main"
[device.dividers]
cpu = 2

[[device]]
name = "antic"
kind = "atari.antic"
domain = "main"
[device.params]
fetch_bus = "cpu"
pal = true
[device.dividers]
dot = 1

[[device]]
name = "pokey"
kind = "atari.pokey"
domain = "main"
[device.dividers]
cpu = 2

[[device]]
name = "pia"
kind = "atari.pia"
domain = "main"
[device.dividers]
cpu = 2

[[device]]
name = "wram"
kind = "atari.ram"
domain = "main"
[device.params]
size = 0xC000

[[device]]
name = "os"
kind = "atari.rom"
domain = "main"
[device.params]
size = 0x2000
readonly = true

[[bus]]
name = "cpu"
address_bits = 16
owner = "cpu0"

[[window]]
name = "w_ram"
bus = "cpu"
device = "wram"
base = "0x0000"
size = "0xC000"

[[window]]
name = "w_gtia"
bus = "cpu"
device = "antic"
base = "0xD000"
size = "0x0020"
mirror_stride = "0x0020"
mirror_count = 7

[[window]]
name = "w_pokey"
bus = "cpu"
device = "pokey"
base = "0xD200"
size = "0x0010"
mirror_stride = "0x0010"
mirror_count = 15

[[window]]
name = "w_pia"
bus = "cpu"
device = "pia"
base = "0xD300"
size = "0x0004"
mirror_stride = "0x0010"
mirror_count = 15

[[window]]
name = "w_antic"
bus = "cpu"
device = "antic"
base = "0xD400"
size = "0x0010"
mirror_stride = "0x0010"
mirror_count = 1

[[window]]
name = "w_os"
bus = "cpu"
device = "os"
base = "0xE000"
size = "0x2000"

[[connection]]
from = "antic.nmi"
to = "cpu0.nmi"
semantics = "display-sync"

[[connection]]
from = "antic.halt"
to = "cpu0.halt"
semantics = "dma-request"

[[connection]]
from = "pokey.irq"
to = "cpu0.irq"
semantics = "irq"

[[connection]]
from = "pia.irq"
to = "cpu0.irq"
semantics = "irq"

[boot.os]
rom = "atari800-os.rom"

[quirks]
"mos6502.undocumented" = true
