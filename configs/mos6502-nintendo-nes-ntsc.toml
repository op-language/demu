# The plain 6502 view of the NTSC NES.
#
# This alias extends the RP2A03 NTSC config and overrides the CPU
# kind to the region-parameterized mos6502.cpu. The chip devices of
# the parent config remain, and the dividers stay the NTSC ones.

[system]
name = "Nintendo NES (NTSC, plain 6502)"
triple = "mos6502-nintendo-nes-ntsc"
description = "The NTSC NES machine viewed as a plain MOS 6502."

[extends]
base = "rp2A03-nintendo-nes-ntsc"

[[device]]
name = "cpu0"
kind = "mos6502.cpu"
domain = "main"
[device.dividers]
cpu = 12

[quirks]
"mos6502.undocumented" = true
