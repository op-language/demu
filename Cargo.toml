[workspace]
resolver = "3"
members = [
    "crates/demu",
    "crates/demu-core",
    "crates/demu-config",
    "crates/demu-symbols",
    "crates/demu-shell",
    "crates/demu-dev-memory",
    "crates/demu-dev-cartridge",
    "crates/demu-dev-video",
    "crates/demu-dev-audio",
    "crates/demu-dev-io",
    "crates/demu-dev-serial",
    "crates/demu-dev-dma",
    "crates/demu-cpu-sm83",
    "crates/demu-cpu-mos6502",
    "crates/demu-cpu-mos65sc02",
    "crates/demu-cpu-wdc65c816",
    "crates/demu-cpu-huc6280",
    "crates/demu-cpu-z80",
    "crates/demu-cpu-m68000",
    "crates/demu-resample",
    "crates/demu-mkv",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Dave Grantham"]

[workspace.lints.rust]
unused_must_use = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
float_arithmetic = "deny"