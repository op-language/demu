[package]
name = "demu-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Interactive shell, JSON-lines protocol, and Unix-socket server for demu."

[dependencies]
png = "0.18.1"
demu-config = { version = "0.1.0", path = "../demu-config" }
demu-core = { version = "0.1.0", path = "../demu-core" }
demu-symbols = { version = "0.1.0", path = "../demu-symbols" }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
