[package]
name = "demu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A cycle-accurate debugging emulator for the op-language targets."

[[bin]]
name = "demu"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
demu-config = { version = "0.1.0", path = "../demu-config" }
demu-core = { version = "0.1.0", path = "../demu-core" }
demu-shell = { version = "0.1.0", path = "../demu-shell" }
demu-mkv = { version = "0.1.0", path = "../demu-mkv" }
demu-symbols = { version = "0.1.0", path = "../demu-symbols" }
demu-cpu-sm83 = { version = "0.1.0", path = "../demu-cpu-sm83" }
demu-cpu-mos6502 = { version = "0.1.0", path = "../demu-cpu-mos6502" }
demu-cpu-mos65sc02 = { version = "0.1.0", path = "../demu-cpu-mos65sc02" }
demu-cpu-huc6280 = { version = "0.1.0", path = "../demu-cpu-huc6280" }
demu-cpu-wdc65c816 = { version = "0.1.0", path = "../demu-cpu-wdc65c816" }
demu-cpu-m68000 = { version = "0.1.0", path = "../demu-cpu-m68000" }
demu-cpu-z80 = { version = "0.1.0", path = "../demu-cpu-z80" }
demu-dev-memory = { version = "0.1.0", path = "../demu-dev-memory" }
demu-dev-cartridge = { version = "0.1.0", path = "../demu-dev-cartridge" }
demu-dev-video = { version = "0.1.0", path = "../demu-dev-video" }
demu-dev-audio = { version = "0.1.0", path = "../demu-dev-audio" }
demu-dev-io = { version = "0.1.0", path = "../demu-dev-io" }
demu-dev-serial = { version = "0.1.0", path = "../demu-dev-serial" }
demu-dev-dma = { version = "0.1.0", path = "../demu-dev-dma" }
png = "0.18.1"
rmcp = { version = "3.5.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }